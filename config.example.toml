# =============================================================================
# tiddl (ElVigilante Edition) — COMPLETE example configuration
# -----------------------------------------------------------------------------
# Copy this file to:
#   Windows  : %USERPROFILE%\.tiddl\config.toml
#   Linux/Mac: ~/.tiddl/config.toml
#   Portable : a 'config' folder next to the executable
#   (or set the TIDDL_PATH environment variable to the folder that holds it)
#
# Every value shown is the program DEFAULT. You can delete any line: when a key
# is missing, tiddl falls back to the default noted in the comment.
# =============================================================================

# Cache API responses (album/track listings) to avoid repeating calls in the
# same session. Faster and lowers the risk of rate-limiting (429).
enable_cache = true            # default: true

# Verbose logs (DEBUG level) for troubleshooting. Noisy.
debug = false                  # default: false


# =============================================================================
# [metadata] — which tags are written INSIDE the audio file
# =============================================================================
[metadata]
# Write tags at all (title, artist, album, number, ISRC, credits, ...).
# If set to false, audio is downloaded "bare", with no tags.
enable = true                  # default: true

# Embed SYNCED lyrics inside the file (LYRICS tag).
embed_lyrics = false           # default: false

# Save lyrics as a separate .lrc file next to the track.
save_lyrics = false            # default: false

# Embed the COVER art INSIDE the .flac/.m4a. This is the image shown by your
# player / VirtualDJ / RadioBoss. (Different from [cover] save, which writes a
# standalone .jpg.) Recommended: true.
cover = false                  # default: false

# Embed the album review (text) into the COMMENT tag.
album_review = false           # default: false


# =============================================================================
# [cover] — save the cover as a STANDALONE .jpg FILE (separate from the audio)
# Note: to embed the cover INSIDE the audio use [metadata] cover = true.
# =============================================================================
[cover]
# Enable saving the standalone .jpg.
save = false                   # default: false

# Square side length in pixels. Maximum allowed by TIDAL: 1280.
size = 1280                    # default: 1280  (max: 1280)

# Which download types get the .jpg. A list; empty = none.
allowed = []                   # default: []  — options: ["track", "album", "playlist"]

# Path/name templates for the .jpg (empty = next to the audio, default name).
# Uses the same tokens as [templates] (see below).
[cover.templates]
track = ""                     # default: ""
album = ""                     # default: ""
playlist = ""                  # default: ""


# =============================================================================
# [download] — quality, paths, pacing and filters
# =============================================================================
[download]
# Audio quality:
#   "low"      = AAC 96k        "high"     = AAC 320k
#   "lossless" = FLAC 16-bit    "hires"    = FLAC 24-bit (HiRes / MQA)
track_quality = "high"         # default: "high"

# Which client_id backs each request, depending on quality. The HiRes client
# (fX2Jxdmnt) delivers 24-bit but TIDAL applies a STRICT rate limit to it (429s
# on big lists); the TV client tops out at LOSSLESS 16-bit but is lenient.
# Needs both tokens (`tiddl auth login`).
#   "auto"   = HiRes only when you ask for -q max; TV otherwise (avoids 429)  <- recommended
#   "always" = HiRes always (max quality, higher 429 risk)
#   "never"  = TV always (never 24-bit, most lenient)
hires_client = "auto"          # default: "auto"

# Video quality: "audio" (audio track only), "360", "480", "720", "1080", "fhd".
video_quality = "fhd"          # default: "fhd"

# Skip files already present on disk (don't re-download).
skip_existing = true           # default: true

# Concurrent downloads per album. 1 = serial/quiet, 2 = balanced,
# 4+ = aggressive (faster but more detectable / more 429).
threads_count = 1              # default: 1

# Cap on API calls per minute. 20 = "human" pace, 50 = normal,
# 80+ = aggressive. Lower it if you get 429s.
requests_per_minute = 20       # default: 20

# Destination folder for downloads. If omitted: ~/Music/tiddl
# (Windows accepts paths with escaped \\ or /, and network drives like "Z:\\")
# download_path = "~/Music/tiddl"

# Folder scanned to detect what you already have (usually = download_path).
# If omitted and you change download_path, scan_path inherits it automatically.
# scan_path = "~/Music/tiddl"

# Separate folder for videos. If omitted: uses download_path.
# video_download_path = "~/Videos/tiddl"

# When downloading an ARTIST, what to do with singles/EPs:
#   "none" = albums only    "only" = singles only    "include" = albums + singles
singles_filter = "none"        # default: "none"

# What to do with videos when downloading albums/artists:
#   "none" = ignore videos   "only" = videos only   "allow" = audio + videos
videos_filter = "none"         # default: "none"

# When downloading an ARTIST, exclude these release types. TIDAL lists them as
# plain albums, so they are identified from the artist page (the same
# "Compilations" / "Live albums" sections the TIDAL app shows) and skipped.
exclude_compilations = false   # default: false — skip the artist's compilations
exclude_live_albums = false    # default: false — skip the artist's live albums

# Set the file modified time (mtime) to the release date.
update_mtime = false           # default: false

# Rewrite metadata on files that ALREADY exist (useful after changing tags/
# template or enabling [metadata] cover). With skip_existing it re-tags without
# re-downloading.
rewrite_metadata = false       # default: false

# Albums in parallel when downloading an ARTIST. 1 = serial (recommended, quiet).
artist_concurrency = 1         # default: 1

# Max random delay (seconds) BEFORE each album of an artist (human-like).
artist_delay = 8.0             # default: 8.0

# Max random delay (seconds) between tracks. ~15% chance of multiplying it by
# 2x-6x (simulates a "distraction").
track_delay = 3.0              # default: 3.0

# Max tracks per run. 0 = unlimited.
max_tracks_per_session = 0     # default: 0

# Destination-volume identity: refuse to write if download_path/
# video_download_path doesn't resolve to the destination you actually meant
# (e.g. an unmounted NAS/USB drive silently falling back to a local folder
# with the same path). "off" writes exactly as before, no extra checks.
# "strict" requires the root to have been explicitly trusted first — see
# `tiddl destination trust/status/forget --help`. A refusal never loses
# data: the verified local copy is retained (`tiddl recover` picks it up
# once the real destination is trusted) and the command exits non-zero.
destination_identity = "off"   # default: "off"  — options: "off", "strict"


# =============================================================================
# [m3u] — generate .m3u playlists
# =============================================================================
[m3u]
# Enable creating .m3u files.
save = false                   # default: false

# Which resources get an .m3u. A list; empty = none.
allowed = []                   # default: []  — options: ["album", "playlist", "mix"]

# Path/name templates for the .m3u (uses the [templates] tokens).
[m3u.templates]
album = ""                     # default: ""
playlist = ""                  # default: ""
mix = ""                       # default: ""


# =============================================================================
# [templates] — how folders and files are named
# -----------------------------------------------------------------------------
# 'default' is used for anything without a specific template. Empty fields
# (track/video/album/playlist/mix) INHERIT from 'default'.
# Use "/" as the folder separator (works on Windows too; it is converted).
#
# AVAILABLE TOKENS (inside braces, e.g. {item.title}):
#
#   item.*    (track/video)
#     id, title, safe_title, title_version, number, volume, version,
#     copyright, bpm, isrc, quality, artist, safe_artist, artists,
#     safe_artists, features, artists_with_features, explicit, genre,
#     dolby, releaseDate, streamStartDate
#
#   album.*
#     id, title, safe_title, artist, safe_artist, artists, safe_artists,
#     date, explicit, master, release
#
#   playlist.*
#     uuid, title, index, created, updated
#
#   SHORTCUTS (aliases, no prefix):
#     title, artist, albumartist, artist_initials (first letter of the artist,
#     to group A/B/C...), release_date, quality, now
#
#   SPECIAL FORMATTING:
#     Dates (datetime) accept strftime:        {album.date:%Y}        -> 2024
#     Number with zero-padding:                {item.number:02}       -> 05
#     explicit (only appears if the track is explicit):
#       {item.explicit:shortparens} -> " (explicit)"
#       {item.explicit:parens}      -> " (Explicit)"
#       {item.explicit:upperlong}   -> "EXPLICIT"
#       {item.explicit:upper}       -> "E"
#       {item.explicit:long}        -> "explicit"
#       {item.explicit}             -> "E"
#     master / dolby (UserFormat): print the text you write only when it
#       applies, e.g. {album.master:MQA} -> "MQA" when the album is master, else "".
# =============================================================================
[templates]
default = "{album.artist}/{album.title}/{item.title}"   # built-in default
track = ""                     # inherits from default if empty
video = ""                     # inherits from default if empty
album = ""                     # inherits from default if empty
playlist = ""                  # inherits from default if empty
mix = ""                       # inherits from default if empty

# Separator when there are multiple artists. VirtualDJ/RadioBoss do NOT read
# multi-valued tags, which is why the default joins everything into a single
# value with " / ".
artist_separator = " / "       # default: " / "  — others: ", ", " & ", "; "
