[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiddl-elvigilante"
version = "1.1.7"
description = "Modern Python 3.10+ compatible TIDAL downloader - Independent fork with production-grade quality"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "np3ir"},
    {name = "tiddl-elvigilante contributors"},
]
maintainers = [
    {name = "np3ir"},
]
requires-python = ">=3.10"
keywords = ["tidal", "downloader", "music", "streaming", "python3.10", "tidal-downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.9.0",
    # tiddl/cli/app.py imports `click` directly (click.Option en _reorder_download_options).
    # Antes lo arrastraba typer transitivamente; typer>=0.27 ya NO declara click como
    # dependencia, así que en instalaciones limpias `tiddl` reventaba con
    # "ModuleNotFoundError: No module named 'click'". Declararlo explícitamente.
    "click>=8.0",
    "requests>=2.31.0",
    "requests-cache>=1.2.0",
    "rich>=13.7.0",
    "mutagen>=1.47.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "tqdm>=4.66.0",
    "pycryptodome>=3.20.0",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0",
    # Cross-process auth-refresh lock (tiddl/cli/ctx.py). Was an undeclared
    # import that only happened to resolve on machines where another package
    # pulled it in; clean venvs (fresh macOS/Linux) crashed at download time.
    "filelock>=3.12.0",
    # CRITICAL: Pydantic v1 required - code uses .parse_obj() from v1
    "pydantic<2.0",
    "pymp4>=1.4.0",
    "m3u8>=3.6.0",
    # Python 3.10 compatibility - 3.11+ has tomllib built-in
    'tomli>=2.0.0;python_version<"3.11"',
    # Optional for better transliteration
    "unidecode>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "responses>=0.24",
    # NB: aioresponses is intentionally NOT used — it is incompatible with the
    # pinned aiohttp 3.14 (ClientResponse now requires `stream_writer`). The
    # downloader tests use a real local aiohttp server instead (tests/test_downloader.py).
    "mypy>=1.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.3.0",
]

[project.urls]
Homepage = "https://github.com/np3ir/tiddl-elvigilante"
Documentation = "https://github.com/np3ir/tiddl-elvigilante#readme"
Repository = "https://github.com/np3ir/tiddl-elvigilante"
Issues = "https://github.com/np3ir/tiddl-elvigilante/issues"
Changelog = "https://github.com/np3ir/tiddl-elvigilante/blob/main/CHANGELOG.md"
"Original Project" = "https://github.com/oskvr37/tiddl"
"About Fork" = "https://github.com/np3ir/tiddl-elvigilante/blob/main/FORK.md"

[project.scripts]
tiddl-elvigilante = "tiddl.cli.app:main"
tiddl = "tiddl.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiddl*"]

[tool.setuptools.package-data]
tiddl = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
select = ["E", "F", "W", "I"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
